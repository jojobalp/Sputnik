name: Compilar jogo para Windows
on:
  push:
    branches: [arena/01a0a57b-sputnik]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:windows
      - name: Verify complete Windows package
        shell: pwsh
        run: |
          $exe = Get-Item 'out/windows/Sobreviva-a-Noite-Windows-x64-1.0.0.exe'
          if ($exe.Length -lt 50000000) { throw 'Portable executable is unexpectedly small.' }
          if (!(Test-Path 'out/windows/win-unpacked/resources/app.asar')) { throw 'Game archive missing.' }
          Get-FileHash 'out/windows/*.exe','out/windows/*.zip' -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content 'out/windows/SHA256SUMS.txt'
          Copy-Item desktop/COMO-JOGAR.txt out/windows/COMO-JOGAR.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Sobreviva-a-Noite-Windows-64bits
          path: |
            out/windows/*.exe
            out/windows/*.zip
            out/windows/SHA256SUMS.txt
            out/windows/COMO-JOGAR.txt
          if-no-files-found: error
          retention-days: 30
